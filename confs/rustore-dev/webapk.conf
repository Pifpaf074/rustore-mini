# RuStore mini — dev: тот же нативный слой, но UI грузится удалённо (быстрая итерация).
id = rustore
name = RuStore mini dev
versionCode = 25
versionName = 2.9.6

# UI тянется с сервера (см. /work/rustore-mini/deploy.sh), правится без пересборки APK.
mainURL = https://example.com/rustore/

# Расширение форка: список установленных пакетов + установка APK.
managePackages = true

# RuStore: leaf -> Russian Trusted Sub CA -> Russian Trusted Root CA
# .crt, а не .pem — см. комментарий в confs/rustore/webapk.conf
ca = ru_trusted_root_ca.crt ru_trusted_sub_ca.crt ru_trusted_sub_ca_2022.crt

icon = icon.png

edgeToEdge = true
requireDoubleBackToExit = false
pullToRefresh = true
cacheMode = default
DebugWebView = true

enableExternalLinks = true
openExternalLinksInBrowser = true
confirmOpenInBrowser = false
allowOpenMobileApp = true
confirmOpenExternalApp = false
