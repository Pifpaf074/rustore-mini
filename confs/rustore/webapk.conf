# RuStore mini — релиз. UI вшит в APK (site = site), сервер отдаёт только APK + version.json.
id = rustore
name = RuStore mini
versionCode = 25
versionName = 2.9.6

# UI вшивается в APK и отдаётся с виртуального origin https://app.local/
site = site

# Расширение форка: список установленных пакетов + установка APK (QUERY_ALL_PACKAGES,
# REQUEST_INSTALL_PACKAGES, мосты WebToApk.installApk/getInstalledApps/... ).
managePackages = true

# RuStore: leaf -> Russian Trusted Sub CA -> Russian Trusted Root CA
# Сертификаты лежат как .crt, а не .pem: песочница агента монтирует пустую
# read-only заглушку поверх *.pem в этом репозитории, и сборка вшивала 0 байт.
ca = ru_trusted_root_ca.crt ru_trusted_sub_ca.crt ru_trusted_sub_ca_2022.crt

icon = icon.png

edgeToEdge = true
requireDoubleBackToExit = false
pullToRefresh = true
cacheMode = default
DebugWebView = false

# Внешние ссылки (карточка -> «Открыть на сайте») открываем в браузере сразу, без диалога.
enableExternalLinks = true
openExternalLinksInBrowser = true
confirmOpenInBrowser = false
allowOpenMobileApp = true
confirmOpenExternalApp = false
